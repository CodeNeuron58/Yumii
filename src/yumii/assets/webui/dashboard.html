<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumii</title>
    <link rel="icon" href="/ui/yumii-icon.png">
    <link rel="preload" href="/ui/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/ui/tokens.css">
    <link rel="stylesheet" href="/ui/dashboard.css">
</head>
<body>
    <div class="app">
        <header class="titlebar">
            <div class="brand"><img src="/ui/yumii-icon.png" alt=""><span>Yumii</span></div>
            <nav class="tabs" id="tabs" aria-label="Dashboard sections"></nav>
            <div class="live"><span class="dot" id="live-dot"></span><span id="live-text">connecting…</span></div>
        </header>
        <div class="banner" id="banner">
            <span>Restart Yumii to apply this change — quit her from the tray icon, then open her again.</span>
        </div>
        <main id="main"></main>
    </div>
    <script type="module" src="/ui/dashboard.js"></script>
</body>
</html>
