name: Release

# Machine plumbing for the one-command installer at https://yumii.me —
# humans never download anything from this page by hand.
#
#   git tag v0.11.0 && git push origin v0.11.0
#
# publishes two artifacts:
#   * the `yumii` wheel to PyPI        (installed via `uv tool install yumii`)
#   * the bare desktop shell Yumii.exe (fetched by install.ps1 from
#     .../releases/latest/download/Yumii.exe)
#
# PyPI auth is Trusted Publishing (GitHub OIDC) — no tokens, no secrets.
# The PyPI project's publisher must point at THIS workflow filename and
# the `pypi` environment.
#
# Chain: test → pypi → shell. A red test job stops the wheel; a failed
# wheel stops the exe — the installer's contract is "backend from PyPI +
# exe from releases/latest", and the two must never skew.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release + upload the shell exe

jobs:
  test:
    name: Tests (gate the release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync deps (incl. dev tools)
        run: uv sync --extra dev

      - name: Verify the pushed tag matches the project version
        run: python .github/scripts/check_tag.py
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Verify versions stay aligned (pyproject / tauri / cargo)
        run: python .github/scripts/check_versions.py

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests/ -q

  pypi:
    name: Publish wheel to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build the wheel + sdist
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  shell:
    name: Desktop shell (Windows)
    runs-on: windows-latest
    needs: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build the bare shell (no bundling)
        working-directory: desktop
        # Pinned to the v2 line — @latest would let a Tauri v3 change the
        # release behavior at tag time.
        run: npx @tauri-apps/cli@^2 build

      - name: Stage the exe under its public name
        run: Copy-Item desktop/src-tauri/target/release/yumii-desktop.exe Yumii.exe

      - name: Publish release with the shell exe
        uses: softprops/action-gh-release@v2
        with:
          name: Yumii ${{ github.ref_name }}
          # App releases must own the "latest" pointer — the installer
          # fetches Yumii.exe from releases/latest/download, and the
          # one-off models release must never steal it.
          make_latest: true
          body: |
            **Experimental preview.** Don't download anything here — install
            Yumii with one command: see https://yumii.me

            This page is plumbing for the installer: it fetches `Yumii.exe`
            (the desktop shell) from here, and the backend comes from PyPI.
          files: Yumii.exe
