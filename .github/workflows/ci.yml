name: CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install dependencies
      # --locked: fail if uv.lock drifted from pyproject.toml instead of
      # silently re-resolving (a lock missing sherpa-onnx-core shipped a
      # Windows segfault).
      run: uv sync --locked --extra dev

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Test with pytest
      shell: bash
      run: |
        set -o pipefail
        uv run pytest tests/ -q -rfE 2>&1 | tee pytest-out.txt || {
          # Surface each failure as an annotation — readable on the checks
          # page (and via the API) without opening the raw log.
          grep -E '^(FAILED|ERROR) ' pytest-out.txt | head -25 | sed 's/^/::error::/'
          exit 1
        }

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Versions must match across pyproject / tauri.conf / Cargo
      run: python .github/scripts/check_versions.py

  desktop:
    name: Desktop shell build (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: desktop/src-tauri

    - name: Build the Tauri shell
      run: cargo build --manifest-path desktop/src-tauri/Cargo.toml

    # The installed shell is a release build, and its backend spawn path is
    # #[cfg(not(debug_assertions))] — a debug build never compiles it.
    - name: Check release-only code paths
      run: cargo check --release --manifest-path desktop/src-tauri/Cargo.toml
